name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported build and the one in daily use.
        claude-code: ["2.1.326", "2.1.330"]
    name: test (Claude Code ${{ matrix.claude-code }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@${{ matrix.claude-code }}
      - name: Validate the plugin
        run: claude plugin validate .
      - name: Run the tests
        run: claude plugin test
